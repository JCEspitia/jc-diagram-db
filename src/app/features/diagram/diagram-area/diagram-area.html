<section
  class="area"
  [style.left.px]="area().x"
  [style.top.px]="area().y"
  [style.width.px]="area().width"
  [style.height.px]="area().height"
  [style.--area-color]="area().color"
  [class.collapsed]="area().collapsed"
>
  <header
    [appTooltip]="tooltipDetails() ? 'Area details' : null"
    [appTooltipDetails]="tooltipDetails()"
    appTooltipPosition="side"
    (pointerdown)="startMove($event)"
  >
    <button
      type="button"
      class="collapse-action"
      [attr.aria-label]="area().collapsed ? 'Expand area' : 'Collapse area'"
      [appTooltip]="area().collapsed ? 'Expand area' : 'Compact area'"
      (pointerdown)="toggleCollapsed($event)"
    >
      <svg lucideChevronRight size="13"></svg>
    </button>
    <strong>{{ area().name }}</strong>
    <button
      type="button"
      appTooltip="Configure area"
      aria-label="Configure area"
      (pointerdown)="edit($event)"
    >
      <svg lucideSettings size="14"></svg>
    </button>
  </header>
  <button
    type="button"
    class="resize-handle"
    aria-label="Resize area"
    (pointerdown)="startResize($event)"
  ></button>
</section>
