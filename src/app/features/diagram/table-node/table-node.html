<article class="table-card" (pointerdown)="select()">
  <header (pointerdown)="startDrag($event)">
    <svg lucideTable2 size="14"></svg>
    <strong>{{ table().name }}</strong>
    <button type="button" aria-label="Table options"><svg lucideEllipsis size="16"></svg></button>
  </header>

  <div class="columns">
    @for (column of table().columns; track column.id) {
      <div
        class="column-row"
        [class.selected]="selectedColumnId() === column.id"
        [class.relationship-target]="relationshipTargetColumnId() === column.id"
        [attr.data-table-id]="table().id"
        [attr.data-column-id]="column.id"
        (pointerdown)="interactWithColumn($event, column.id)"
        (pointerenter)="hoverColumn(column.id)"
        (pointerleave)="columnHovered.emit(null)"
      >
        <span class="constraints">
          @if (column.primaryKey) {
            <svg lucideKeyRound size="12" class="key-icon" aria-label="Primary key"></svg>
          }
          @if (foreignKeyColumnIds().has(column.id)) {
            <svg lucideLink2 size="12" class="link-icon" aria-label="Foreign key"></svg>
          }
        </span>
        <span class="column-name">{{ column.name }}</span>
        <span class="column-type">{{ column.type }}</span>
        <span class="badges">
          @if (!column.nullable) {
            <b title="Not null">NN</b>
          }
          @if (column.unique) {
            <b title="Unique">UQ</b>
          }
          @if (column.increment) {
            <b title="Auto increment">AI</b>
          }
        </span>
        <button
          class="handle"
          type="button"
          aria-label="Create relationship from column"
          (pointerdown)="startRelationship($event, column.id)"
        ></button>
      </div>
    }
  </div>
</article>
