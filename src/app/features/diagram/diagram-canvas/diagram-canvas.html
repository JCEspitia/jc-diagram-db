<section
  #viewport
  class="viewport"
  aria-label="Database diagram"
  (pointerdown)="startPan($event)"
  (pointermove)="movePointer($event)"
  (pointerup)="endPointer($event)"
  (pointercancel)="cancelPointer($event)"
  (wheel)="zoom($event)"
>
  <div class="world" [style.transform]="transform()">
    <svg class="relationships" width="1600" height="1000">
      @for (edge of edges(); track edge.relationship.id) {
        <path class="edge-shadow" [class.dimmed]="!edge.connected" [attr.d]="edge.path" />
        <path
          class="edge-hit-area"
          [attr.d]="edge.path"
          (pointerdown)="selectRelationship($event, edge.relationship.id)"
          (pointermove)="hoverRelationshipSegment($event, edge)"
          (pointerleave)="clearHoveredSegment($event, edge.relationship.id)"
        />
        <path
          class="edge"
          [class.selected]="selectedRelationshipId() === edge.relationship.id"
          [class.dimmed]="!edge.connected"
          [attr.d]="edge.path"
        />
        <g
          class="cardinality-symbol"
          [class.dimmed]="!edge.connected"
          [attr.transform]="symbolTransform(edge.source, edge.points[1]!.x)"
        >
          @if (edge.sourceCardinality === 'many') {
            <path d="M 15 -6 L 7 0 L 15 6 M 7 -5 V 5" />
          } @else {
            <path d="M 8 -5 V 5" />
          }
        </g>
        <g
          class="cardinality-symbol"
          [class.dimmed]="!edge.connected"
          [attr.transform]="symbolTransform(edge.target, edge.points[edge.points.length - 2]!.x)"
        >
          @if (edge.targetCardinality === 'many') {
            <path d="M 15 -6 L 7 0 L 15 6 M 7 -5 V 5" />
          } @else {
            <path d="M 8 -5 V 5" />
          }
        </g>
        @if (edge.flow) {
          <path class="edge-flow" [class.reverse]="edge.flow === 'reverse'" [attr.d]="edge.path" />
        }
        @if (selectedRelationshipId() === edge.relationship.id) {
          @for (handle of edge.handles; track handle.segmentIndex) {
            <circle
              class="route-handle"
              [class.horizontal]="handle.orientation === 'horizontal'"
              [class.vertical]="handle.orientation === 'vertical'"
              [attr.cx]="handle.point.x"
              [attr.cy]="handle.point.y"
              r="5"
              (pointerdown)="startSegmentDrag($event, edge, handle)"
            />
          }
        }
        @if (hoveredSegment(); as hovered) {
          @if (
            hovered.relationshipId === edge.relationship.id &&
            selectedRelationshipId() !== edge.relationship.id
          ) {
            <circle
              class="route-handle ghost"
              [class.horizontal]="hovered.orientation === 'horizontal'"
              [class.vertical]="hovered.orientation === 'vertical'"
              [attr.cx]="hovered.point.x"
              [attr.cy]="hovered.point.y"
              r="5"
              (pointerdown)="startHoveredSegment($event, edge)"
            />
          }
        }
      }
      @if (temporaryPath(); as path) {
        <path class="temporary-edge" [attr.d]="path" />
      }
    </svg>

    @for (table of schema().tables; track table.id) {
      <app-table-node
        [table]="table"
        [layout]="tablePosition(table.id)"
        [relationships]="schema().relationships"
        [selected]="selectedTableId() === table.id"
        [selectedColumnId]="selectedColumnId()"
        [relationshipTargetColumnId]="relationshipTarget()?.columnId"
        [showRelationshipHandles]="relationshipMode()"
        (tableSelected)="tableSelected.emit($event)"
        (columnSelected)="columnSelected.emit($event)"
        (dragStarted)="startTableDrag($event)"
        (relationshipStarted)="startRelationship($event)"
        (columnHovered)="setHoveredColumn($event)"
      />
    }
  </div>
</section>
