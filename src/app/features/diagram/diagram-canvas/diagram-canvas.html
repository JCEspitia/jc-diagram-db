<section class="viewport" aria-label="Database diagram">
  <div class="world" [style.transform]="transform()">
    <svg class="relationships" width="1600" height="1000" aria-hidden="true">
      @for (edge of edges(); track edge.relationship.id) {
        <path class="edge-shadow" [attr.d]="edge.path" />
        <path class="edge" [attr.d]="edge.path" />
      }
    </svg>

    @for (table of schema().tables; track table.id) {
      <app-table-node
        [table]="table"
        [layout]="tablePosition(table.id)"
        [relationships]="schema().relationships"
      />
    }
  </div>
</section>
