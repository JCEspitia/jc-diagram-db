<section
  #viewport
  class="viewport"
  aria-label="Database diagram"
  (pointerdown)="startPan($event)"
  (pointermove)="movePointer($event)"
  (pointerup)="endPointer($event)"
  (pointercancel)="cancelPointer($event)"
  (wheel)="zoom($event)"
>
  <div class="world" [style.transform]="transform()">
    <svg
      class="relationships"
      [class.editing]="selectedRelationshipId()"
      width="1600"
      height="1000"
    >
      @for (edge of edges(); track edge.relationship.id) {
        <path class="edge-shadow" [class.dimmed]="!edge.connected" [attr.d]="edge.path" />
        <path
          class="edge-hit-area"
          [class.active]="selectedRelationshipId() === edge.relationship.id"
          [attr.d]="edge.path"
          (pointerdown)="selectRelationship($event, edge.relationship.id)"
          (pointermove)="hoverRelationshipSegment($event, edge)"
          (pointerleave)="clearHoveredSegment($event, edge.relationship.id)"
        />
        <path
          class="edge"
          [class.selected]="selectedRelationshipId() === edge.relationship.id"
          [class.dimmed]="!edge.connected"
          [attr.d]="edge.path"
        />
        <g
          class="cardinality-symbol"
          [class.dimmed]="!edge.connected"
          [attr.transform]="symbolTransform(edge.source, edge.points[1]!.x)"
        >
          <circle r="10" />
          <text x="0" y="0">
            {{
              edge.sourceCardinality === 'many'
                ? 'N'
                : edge.sourceCardinality === 'zero'
                  ? '0'
                  : '1'
            }}
          </text>
        </g>
        <g
          class="cardinality-symbol"
          [class.dimmed]="!edge.connected"
          [attr.transform]="symbolTransform(edge.target, edge.points[edge.points.length - 2]!.x)"
        >
          <circle r="10" />
          <text x="0" y="0">
            {{
              edge.targetCardinality === 'many'
                ? 'N'
                : edge.targetCardinality === 'zero'
                  ? '0'
                  : '1'
            }}
          </text>
        </g>
        @if (edge.flow) {
          <path class="edge-flow" [class.reverse]="edge.flow === 'reverse'" [attr.d]="edge.path" />
        }
        @if (selectedRelationshipId() === edge.relationship.id) {
          <foreignObject
            class="route-actions"
            [attr.x]="edge.resetPoint.x - (edge.canReset ? 29 : 14)"
            [attr.y]="edge.resetPoint.y - 35"
            [attr.width]="edge.canReset ? 58 : 29"
            height="30"
          >
            <div>
              <button
                type="button"
                appTooltip="Relationship settings"
                aria-label="Open relationship settings"
                [class.active]="relationshipToolboxId() === edge.relationship.id"
                (pointerdown)="toggleRelationshipToolbox($event, edge.relationship.id)"
              >
                <svg lucideSettings size="15"></svg>
              </button>
              @if (edge.canReset) {
                <button
                  type="button"
                  appTooltip="Reset line"
                  aria-label="Reset line and calculate the best route"
                  (pointerdown)="resetRelationshipRoute($event, edge.relationship.id)"
                >
                  <svg lucideRotateCcw size="15"></svg>
                </button>
              }
            </div>
          </foreignObject>
          @if (relationshipToolboxId() === edge.relationship.id) {
            <foreignObject
              class="relationship-toolbox"
              [attr.x]="edge.resetPoint.x - 220"
              [attr.y]="edge.resetPoint.y + 12"
              width="440"
              height="42"
            >
              <div>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'one' && edge.targetCardinality === 'one'
                  "
                  appTooltip="One to one"
                  (pointerdown)="changeRelationshipType($event, edge.relationship.id, 'one', 'one')"
                >
                  1:1
                </button>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'one' && edge.targetCardinality === 'many'
                  "
                  appTooltip="One to many"
                  (pointerdown)="
                    changeRelationshipType($event, edge.relationship.id, 'one', 'many')
                  "
                >
                  1:N
                </button>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'many' && edge.targetCardinality === 'one'
                  "
                  appTooltip="Many to one"
                  (pointerdown)="
                    changeRelationshipType($event, edge.relationship.id, 'many', 'one')
                  "
                >
                  N:1
                </button>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'zero' && edge.targetCardinality === 'one'
                  "
                  appTooltip="Zero to one"
                  (pointerdown)="
                    changeRelationshipType($event, edge.relationship.id, 'zero', 'one')
                  "
                >
                  0:1
                </button>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'one' && edge.targetCardinality === 'zero'
                  "
                  appTooltip="One to zero"
                  (pointerdown)="
                    changeRelationshipType($event, edge.relationship.id, 'one', 'zero')
                  "
                >
                  1:0
                </button>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'zero' && edge.targetCardinality === 'many'
                  "
                  appTooltip="Zero to many"
                  (pointerdown)="
                    changeRelationshipType($event, edge.relationship.id, 'zero', 'many')
                  "
                >
                  0:N
                </button>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'many' && edge.targetCardinality === 'zero'
                  "
                  appTooltip="Many to zero"
                  (pointerdown)="
                    changeRelationshipType($event, edge.relationship.id, 'many', 'zero')
                  "
                >
                  N:0
                </button>
                <button
                  type="button"
                  [class.active]="
                    edge.sourceCardinality === 'many' && edge.targetCardinality === 'many'
                  "
                  appTooltip="Many to many"
                  (pointerdown)="
                    changeRelationshipType($event, edge.relationship.id, 'many', 'many')
                  "
                >
                  N:N
                </button>
                <button
                  type="button"
                  [appTooltip]="
                    'Move source port to the ' + (edge.sourceSide === 'left' ? 'right' : 'left')
                  "
                  [attr.aria-label]="'Source port: ' + edge.sourceSide"
                  (pointerdown)="
                    toggleRelationshipSide(
                      $event,
                      edge.relationship.id,
                      'sourceSide',
                      edge.sourceSide
                    )
                  "
                >
                  S
                  @if (edge.sourceSide === 'left') {
                    <svg lucideArrowLeftFromLine size="14"></svg>
                  } @else {
                    <svg lucideArrowRightFromLine size="14"></svg>
                  }
                </button>
                <button
                  type="button"
                  [appTooltip]="
                    'Move target port to the ' + (edge.targetSide === 'left' ? 'right' : 'left')
                  "
                  [attr.aria-label]="'Target port: ' + edge.targetSide"
                  (pointerdown)="
                    toggleRelationshipSide(
                      $event,
                      edge.relationship.id,
                      'targetSide',
                      edge.targetSide
                    )
                  "
                >
                  T
                  @if (edge.targetSide === 'left') {
                    <svg lucideArrowLeftFromLine size="14"></svg>
                  } @else {
                    <svg lucideArrowRightFromLine size="14"></svg>
                  }
                </button>
                <button
                  type="button"
                  class="danger"
                  appTooltip="Delete relationship"
                  aria-label="Delete relationship"
                  (pointerdown)="deleteRelationship($event, edge.relationship.id)"
                >
                  <svg lucideTrash2 size="15"></svg>
                </button>
              </div>
            </foreignObject>
          }
          @for (candidate of edge.pullCandidates; track candidate.segmentIndex + '-' + $index) {
            <circle
              class="route-candidate"
              [attr.cx]="candidate.point.x"
              [attr.cy]="candidate.point.y"
              r="1.8"
            />
          }
          @for (handle of edge.handles; track handle.segmentIndex) {
            <circle
              class="route-handle"
              [class.horizontal]="handle.orientation === 'horizontal'"
              [class.vertical]="handle.orientation === 'vertical'"
              [attr.cx]="handle.point.x"
              [attr.cy]="handle.point.y"
              r="5"
              (pointerdown)="startSegmentDrag($event, edge, handle)"
            />
          }
        }
        @if (hoveredSegment(); as hovered) {
          @if (hovered.relationshipId === edge.relationship.id) {
            <circle
              class="route-handle ghost"
              [class.horizontal]="hovered.orientation === 'horizontal'"
              [class.vertical]="hovered.orientation === 'vertical'"
              [attr.cx]="hovered.point.x"
              [attr.cy]="hovered.point.y"
              r="5"
              (pointerdown)="startHoveredSegment($event, edge)"
            />
          }
        }
      }
      @if (temporaryPath(); as path) {
        <path class="temporary-edge" [attr.d]="path" />
      }
    </svg>

    @for (table of schema().tables; track table.id) {
      <app-table-node
        [table]="table"
        [layout]="tablePosition(table.id)"
        [relationships]="schema().relationships"
        [selected]="selectedTableId() === table.id"
        [selectedColumnId]="selectedColumnId()"
        [relationshipTargetColumnId]="relationshipTarget()?.columnId"
        [showRelationshipHandles]="relationshipMode()"
        (tableSelected)="tableSelected.emit($event)"
        (tableEditRequested)="tableEditRequested.emit($event)"
        (columnSelected)="columnSelected.emit($event)"
        (dragStarted)="startTableDrag($event)"
        (relationshipStarted)="startRelationship($event)"
        (columnHovered)="setHoveredColumn($event)"
      />
    }
  </div>
</section>
