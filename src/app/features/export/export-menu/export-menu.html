<button
  class="export-trigger"
  type="button"
  [disabled]="exporting()"
  [attr.aria-expanded]="open()"
  aria-haspopup="menu"
  (click)="open.update((value) => !value)"
>
  Export
</button>
@if (open()) {
  <div class="export-menu">
    <header>
      <strong>Export diagram</strong>
      <small>Choose the content and file format.</small>
    </header>
    <label>
      <span>Content</span>
      <select [value]="areaId() ?? ''" (change)="areaId.set($any($event.target).value || null)">
        <option value="">Complete diagram</option>
        @for (entry of areaEntries(); track entry[0]) {
          <option [value]="entry[0]">Area: {{ entry[1].name }}</option>
        }
      </select>
    </label>
    <div class="export-formats">
      <button type="button" (click)="export('png')">
        <svg lucideFileImage size="17"></svg>
        <span><b>PNG</b><small>High-resolution image</small></span>
      </button>
      <button type="button" (click)="export('svg')">
        <svg lucideBraces size="17"></svg>
        <span><b>SVG</b><small>Editable vector</small></span>
      </button>
      <button type="button" (click)="export('pdf')">
        <svg lucideFileText size="17"></svg>
        <span><b>PDF report</b><small>Diagram and documentation</small></span>
      </button>
    </div>
    @if (!areaId() && areaEntries().length) {
      <p>The PDF includes the complete diagram and one additional page for every area.</p>
    }
    @if (error()) {
      <p class="export-error">{{ error() }}</p>
    }
  </div>
}
