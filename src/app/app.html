<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" aria-label="DiagramDB home"
      ><span class="brand-mark">D</span><span>Diagram<span>DB</span></span></a
    >
    <span class="divider"></span>
    <button class="project-name" type="button">Ecommerce <span>⌄</span></button>
    <span class="saved"><i></i> Saved locally</span>
    <nav aria-label="Project actions">
      <button type="button" aria-label="Undo">↶</button
      ><button type="button" aria-label="Redo" disabled>↷</button>
      <button class="export" type="button">Export <span>⌄</span></button
      ><button type="button" aria-label="More options">•••</button>
    </nav>
  </header>
  <div class="workspace">
    <aside class="dbml-panel">
      <div class="panel-heading">
        <span>DBML</span><button type="button" aria-label="Collapse DBML panel">‹</button>
      </div>
      <div class="code" aria-label="DBML source">
        @for (line of dbml.split('\n'); track $index) {
          <div>
            <span>{{ $index + 1 }}</span
            ><code>{{ line || ' ' }}</code>
          </div>
        }
      </div>
      <footer><i></i> Valid DBML <span>Ln 12, Col 31</span></footer>
    </aside>
    <main>
      <div class="toolbar">
        <button class="primary" type="button"><b>＋</b> Table</button><span></span
        ><button type="button">⌘ Auto layout</button><button type="button">⌗ Relation</button>
      </div>
      <app-diagram-canvas [schema]="schema" [layout]="layout" />
      <div class="zoom-controls">
        <button type="button" aria-label="Zoom out">−</button><span>100%</span
        ><button type="button" aria-label="Zoom in">＋</button
        ><button type="button" aria-label="Fit diagram">⌗</button>
      </div>
    </main>
    <aside class="inspector">
      <div class="panel-heading"><span>Inspector</span><button type="button">×</button></div>
      <section>
        <label>TABLE NAME</label><input [value]="selectedTable.name" aria-label="Table name" />
      </section>
      <section>
        <div class="section-title"><label>COLUMNS</label><button type="button">＋ Add</button></div>
        @for (column of selectedTable.columns; track column.id) {
          <article class="column-editor">
            <div>
              <strong>{{ column.name }}</strong
              ><button type="button">•••</button>
            </div>
            <select aria-label="Column type">
              <option>{{ column.type }}</option>
            </select>
            <label class="check"
              ><input type="checkbox" [checked]="column.primaryKey" /> Primary key</label
            >
            <label class="check"
              ><input type="checkbox" [checked]="!column.nullable" /> Not null</label
            >
            <label class="check"><input type="checkbox" [checked]="column.unique" /> Unique</label>
          </article>
        }
      </section>
      <button class="delete" type="button">Delete table</button>
    </aside>
  </div>
  <footer class="statusbar">
    <span>2 tables</span><span>5 columns</span><span>1 relationship</span
    ><span class="spacer"></span><span>DiagramDB v0.1</span>
  </footer>
</div>
